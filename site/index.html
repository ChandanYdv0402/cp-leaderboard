<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP Leaderboard</title>
<style>
  :root { color-scheme:dark; --bg:#0f1115; --fg:#e8e8e8; --muted:#999; --line:#2a2d35; --accent:#60a5fa; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; max-width:760px; margin:0 auto; padding:24px 16px; }
  header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  h1 { margin:0 0 4px } h2 { margin-top:28px } .muted { color:var(--muted); font-size:13px }
  .tabs button { background:none; border:1px solid var(--line); color:var(--fg); padding:6px 12px; border-radius:6px; cursor:pointer; margin-right:6px }
  .tabs button.on { border-color:var(--accent); color:var(--accent) }
  .board-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .filters { display:flex; gap:12px; margin-left:auto; }
  .filters label { display:flex; align-items:center; gap:6px; }
  .filters select { font-size:15px; }
  select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; }
  button, input { font:inherit } button { cursor:pointer }
  .auth, .profile { border-bottom:1px solid var(--line); padding:16px 0; }
  .auth { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .profile form { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; align-items:end; }
  label { display:grid; gap:4px; color:var(--muted); font-size:13px; }
  .profile-link { font-size:13px; }
  input { min-width:0; padding:7px 8px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:4px; }
  button.action { padding:7px 10px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:4px; }
  button:disabled { opacity:.55; cursor:wait }
  .message { min-height:1.5em; margin:8px 0 0; color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; margin:12px 0 32px } th,td { text-align:left; padding:8px; border-bottom:1px solid var(--line) }
  th.n, td.n { text-align:right; font-variant-numeric:tabular-nums; width:5.5em } th.rank { width:2em } a { color:var(--accent) }
  @media (max-width:600px) { .profile form { grid-template-columns:1fr; } table { font-size:13px; } th,td { padding:7px 5px; } }
</style>
</head>
<body>
<header>
  <div><h1>CP Leaderboard</h1><div class="muted" id="updated">Connecting...</div></div>
  <div class="muted" id="auth-status" aria-live="polite"></div>
</header>
<section class="auth" aria-label="Account">
  <button class="action" id="login" disabled>Sign in</button>
  <button class="action" id="logout" hidden>Log out</button>
</section>
<section class="profile" id="profile" hidden>
  <h2>My profile</h2>
  <form id="profile-form">
    <label>Name<input id="name" required minlength="2" maxlength="32" autocomplete="nickname"></label>
    <label>Codeforces handle<input id="codeforces" maxlength="200" autocomplete="off" placeholder="Handle or profile URL"><a class="profile-link" id="codeforces-link" target="_blank" rel="noopener noreferrer" hidden>Open Codeforces profile</a></label>
    <label>LeetCode username<input id="leetcode" maxlength="200" autocomplete="off" placeholder="Username or profile URL"><a class="profile-link" id="leetcode-link" target="_blank" rel="noopener noreferrer" hidden>Open LeetCode profile</a></label>
    <button class="action" id="save-profile" type="submit">Save profile</button>
  </form>
  <p class="message" id="profile-message" aria-live="polite"></p>
</section>
<h2>Leaderboard</h2>
<div class="board-bar">
  <div class="tabs" id="tabs"></div>
  <div class="filters">
    <label>Platform
      <select id="platform">
        <option value="all">All</option>
        <option value="lc">LeetCode</option>
        <option value="cf">Codeforces</option>
      </select>
    </label>
    <label>Sort by
      <select id="sort">
        <option value="points">Score</option>
        <option value="solved">Questions solved</option>
        <option value="rating">Rating</option>
      </select>
    </label>
  </div>
</div>
<table><thead><tr><th class="rank">#</th><th>Name</th><th class="n">Points</th><th class="n">Solved</th><th class="n" id="cf-head">CF</th><th class="n" id="lc-head">LC</th></tr></thead><tbody id="board"></tbody></table>
<h2>Upcoming contests</h2>
<table><tbody id="contests"></tbody></table>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://ttcbdfmwsywdgjcwsllf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_I1p51wV_1GUVghTpsFbY5g_ex5cEJL7";
// Clerk publishable key (pk_test_... / pk_live_...) — public, safe to commit. Login providers are chosen in the Clerk dashboard.
const CLERK_PUBLISHABLE_KEY = "pk_test_dHJ1ZS1qYXktNjE1Ny5jbGVyay5hY2NvdW50cy5kZXYk";
const CLERK_JS_URL = "https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js";
const PERIODS = { week: "Weekly", biweek: "Bi-weekly", month: "Monthly", all: "All-time" };
const esc = s => String(s ?? "–").replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const configured = !SUPABASE_URL.includes("YOUR_PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");
const clerkConfigured = !CLERK_PUBLISHABLE_KEY.startsWith("YOUR_");
let clerk = null;
// Supabase third-party auth: every request carries the Clerk session token (or none when logged out).
const supabase = configured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  accessToken: async () => (await clerk?.session?.getToken()) ?? null
}) : null;
const $ = id => document.getElementById(id);
const setMessage = (id, text) => { $(id).textContent = text; };
const showError = (id, error) => setMessage(id, error?.message || "Something went wrong.");
const HANDLE_PATTERN = /^[A-Za-z0-9_.-]{1,40}$/;
function handleFromProfileInput(platform, value) {
  const raw = String(value ?? "").trim();
  if (!raw) return "";
  const isProfileUrl = /^(?:https?:\/\/)?(?:www\.)?(?:codeforces\.com|leetcode\.com)\//i.test(raw);
  if (!isProfileUrl) return raw;
  let url;
  try {
    url = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
  } catch {
    return null;
  }
  const expectedHost = platform === "codeforces" ? "codeforces.com" : "leetcode.com";
  if (url.hostname.toLowerCase().replace(/^www\./, "") !== expectedHost) return null;
  const route = platform === "codeforces" ? /^\/profile\/([^/]+)\/?$/i : /^\/u\/([^/]+)\/?$/i;
  const match = url.pathname.match(route);
  if (!match) return null;
  try {
    return decodeURIComponent(match[1]);
  } catch {
    return null;
  }
}
function updateProfileLinks() {
  const codeforces = handleFromProfileInput("codeforces", $("codeforces").value);
  const leetcode = handleFromProfileInput("leetcode", $("leetcode").value);
  const codeforcesValid = typeof codeforces === "string" && HANDLE_PATTERN.test(codeforces);
  const leetcodeValid = typeof leetcode === "string" && HANDLE_PATTERN.test(leetcode);
  $("codeforces-link").hidden = !codeforcesValid;
  $("leetcode-link").hidden = !leetcodeValid;
  if (codeforcesValid) $("codeforces-link").href = `https://codeforces.com/profile/${encodeURIComponent(codeforces)}`;
  if (leetcodeValid) $("leetcode-link").href = `https://leetcode.com/u/${encodeURIComponent(leetcode)}/`;
}
function normalizeHandleField(platform, inputId) {
  const handle = handleFromProfileInput(platform, $(inputId).value);
  if (typeof handle === "string" && HANDLE_PATTERN.test(handle)) $(inputId).value = handle;
  updateProfileLinks();
}
$("codeforces").addEventListener("input", updateProfileLinks);
$("codeforces").addEventListener("blur", () => normalizeHandleField("codeforces", "codeforces"));
$("leetcode").addEventListener("input", updateProfileLinks);
$("leetcode").addEventListener("blur", () => normalizeHandleField("leetcode", "leetcode"));
async function loadClerk() {
  await new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = CLERK_JS_URL;
    script.async = true;
    script.crossOrigin = "anonymous";
    script.dataset.clerkPublishableKey = CLERK_PUBLISHABLE_KEY;
    script.onload = resolve;
    script.onerror = () => reject(new Error("Could not load sign-in. Check your connection or ad blocker."));
    document.head.appendChild(script);
  });
  const instance = typeof window.Clerk === "function" ? new window.Clerk(CLERK_PUBLISHABLE_KEY) : window.Clerk;
  // Match Clerk's sign-in modal to the page's dark tokens.
  await instance.load({
    appearance: {
      variables: {
        colorBackground: "#161922", colorText: "#e8e8e8", colorTextSecondary: "#999",
        colorInputBackground: "#0f1115", colorInputText: "#e8e8e8", colorPrimary: "#60a5fa", colorNeutral: "#e8e8e8"
      }
    }
  });
  return instance;
}
function currentUser() {
  const u = clerk?.user;
  if (!u) return null;
  return { id: u.id, email: u.primaryEmailAddress?.emailAddress || "", name: u.fullName || u.username || "" };
}
let currentPeriod = "week";
let boardRows = [];
let profileLoadedFor = null;

async function showLeaderboard(period = currentPeriod) {
  currentPeriod = period;
  [...$("tabs").children].forEach(button => button.classList.toggle("on", button.dataset.k === period));
  $("board").innerHTML = "<tr><td colspan=\"6\">Loading...</td></tr>";
  const days = { week: 7, biweek: 14, month: 30, all: null }[period];
  const { data, error } = await supabase.rpc("leaderboard", { days });
  if (period !== currentPeriod) return; // a newer tab click won
  if (error) {
    $("board").innerHTML = "<tr><td colspan=\"6\">Leaderboard is unavailable.</td></tr>";
    return showError("updated", error);
  }
  boardRows = data;
  renderBoard();
}

// Re-render from the last fetched rows; platform/sort changes need no new request.
function renderBoard() {
  const platform = $("platform").value;
  const sort = $("sort").value;
  $("cf-head").hidden = platform === "lc";
  $("lc-head").hidden = platform === "cf";
  const rows = boardRows.map(row => {
    const pick = (cf, lc, all) => platform === "cf" ? cf : platform === "lc" ? lc : all;
    return {
      name: row.name,
      cf_rating: row.cf_rating,
      lc_rating: row.lc_rating,
      // Per-platform fields come from the updated leaderboard() SQL; "–" until it is installed.
      points: pick(row.cf_points, row.lc_points, row.points),
      solved: pick(row.cf_solved, row.lc_solved, row.solved),
      rating: pick(row.cf_rating, row.lc_rating, Math.max(row.cf_rating ?? -1, row.lc_rating ?? -1)),
    };
  });
  const key = r => (sort === "rating" ? r.rating : r[sort]) ?? -1;
  rows.sort((a, b) => key(b) - key(a) || (b.points ?? 0) - (a.points ?? 0));
  const cols = 4 + (platform === "all" ? 2 : 1);
  $("board").innerHTML = rows.map((row, index) =>
    `<tr><td>${index + 1}</td><td>${esc(row.name)}</td><td class="n">${esc(row.points)}</td><td class="n">${esc(row.solved)}</td>` +
    (platform !== "lc" ? `<td class="n">${esc(row.cf_rating)}</td>` : "") +
    (platform !== "cf" ? `<td class="n">${esc(row.lc_rating)}</td>` : "") + "</tr>").join("") ||
    `<tr><td colspan="${cols}">No leaderboard entries yet.</td></tr>`;
}
$("platform").addEventListener("change", renderBoard);
$("sort").addEventListener("change", renderBoard);

async function loadContests() {
  const { data, error } = await supabase.from("contests").select("platform,name,start,duration,url")
    .gte("start", new Date().toISOString()).order("start");
  if (error) {
    $("contests").innerHTML = "<tr><td>Contests are unavailable.</td></tr>";
    return;
  }
  $("contests").innerHTML = data.map(contest => {
    const url = /^https:\/\//i.test(contest.url) ? contest.url : "#";
    return `<tr><td>${contest.platform === "codeforces" ? "CF" : "LC"}</td><td><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(contest.name)}</a></td>` +
      `<td>${new Date(contest.start).toLocaleString()}</td><td class="n">${Math.round(contest.duration / 60)} min</td></tr>`;
  }).join("") || "<tr><td>No upcoming contests.</td></tr>";
}

async function loadProfile(user) {
  $("profile").hidden = !user;
  $("logout").hidden = !user;
  $("login").hidden = Boolean(user);
  if (!user) {
    profileLoadedFor = null;
    $("auth-status").textContent = "";
    return;
  }
  $("auth-status").textContent = user.email || "Signed in";
  if (profileLoadedFor === user.id) return;
  profileLoadedFor = user.id;
  const [{ data: profile }, { data: accounts, error }] = await Promise.all([
    supabase.from("profiles").select("name").eq("id", user.id).maybeSingle(),
    supabase.from("accounts").select("platform,handle,verified").eq("user_id", user.id)
  ]);
  if (error) {
    profileLoadedFor = null;
    return showError("profile-message", error);
  }
  if (profileLoadedFor !== user.id) return;
  const suggestedHandle = (user.email?.split("@")[0] || "").split("+")[0]
    .replace(/[^A-Za-z0-9_.-]/g, "").slice(0, 40);
  $("name").value = profile?.name || user.name;
  $("codeforces").value = accounts.find(account => account.platform === "codeforces")?.handle || suggestedHandle;
  $("leetcode").value = accounts.find(account => account.platform === "leetcode")?.handle || suggestedHandle;
  updateProfileLinks();
  const pending = accounts.filter(account => !account.verified).map(account => account.platform);
  setMessage("profile-message", pending.length ? `Pending verification: ${pending.join(", ")}.` : "");
}

async function refresh() {
  await Promise.all([showLeaderboard(), loadContests()]);
  const { data: latest } = await supabase.from("snapshots").select("taken_at").order("taken_at", { ascending: false }).limit(1).maybeSingle();
  $("updated").textContent = latest ? `Updated ${new Date(latest.taken_at).toLocaleString()}` : "No snapshots yet";
}

for (const [key, label] of Object.entries(PERIODS)) {
  const button = document.createElement("button");
  button.textContent = label;
  button.dataset.k = key;
  button.onclick = () => showLeaderboard(key);
  $("tabs").appendChild(button);
}

if (!configured) {
  $("updated").textContent = "Set the Supabase project URL and anon key in this page to connect.";
  $("board").innerHTML = "<tr><td colspan=\"6\">Supabase configuration required.</td></tr>";
  $("contests").innerHTML = "<tr><td>Supabase configuration required.</td></tr>";
} else {
  $("login").onclick = () => clerk?.openSignIn();
  $("logout").onclick = async () => {
    try {
      await clerk.signOut();
    } catch (error) {
      showError("auth-status", error);
    }
  };
  $("profile-form").onsubmit = async event => {
    event.preventDefault();
    const user = currentUser();
    if (!user) return setMessage("profile-message", "Sign in before saving a profile.");
    const accountsToSave = [
      { platform: "codeforces", inputId: "codeforces" },
      { platform: "leetcode", inputId: "leetcode" }
    ].map(account => ({
      ...account,
      raw: $(account.inputId).value.trim(),
      handle: handleFromProfileInput(account.platform, $(account.inputId).value)
    }));
    const invalidAccount = accountsToSave.find(account =>
      account.raw && (typeof account.handle !== "string" || !HANDLE_PATTERN.test(account.handle)));
    if (invalidAccount) {
      return setMessage("profile-message", `Enter a valid ${invalidAccount.platform} handle or profile URL.`);
    }
    for (const account of accountsToSave) $(account.inputId).value = account.handle || "";
    updateProfileLinks();
    const button = $("save-profile");
    button.disabled = true;
    setMessage("profile-message", "Saving...");
    const { error: profileError } = await supabase.from("profiles").upsert(
      { id: user.id, name: $("name").value.trim() }, { onConflict: "id" });
    if (profileError) {
      button.disabled = false;
      return showError("profile-message", profileError);
    }
    for (const { platform, handle } of accountsToSave) {
      const query = supabase.from("accounts").delete().eq("user_id", user.id).eq("platform", platform);
      const result = handle
        ? await supabase.from("accounts").upsert(
          { user_id: user.id, platform, handle, verified: false }, { onConflict: "user_id,platform" })
        : await query;
      if (result.error) {
        button.disabled = false;
        return showError("profile-message", result.error);
      }
    }
    button.disabled = false;
    setMessage("profile-message", "Saved. Handle verification runs with the next stats update.");
  };
  refresh();
  if (!clerkConfigured) {
    setMessage("auth-status", "Sign-in not configured: set CLERK_PUBLISHABLE_KEY in this page.");
  } else {
    loadClerk().then(instance => {
      clerk = instance;
      $("login").disabled = false;
      clerk.addListener(() => loadProfile(currentUser()));
      return loadProfile(currentUser());
    }).catch(error => showError("auth-status", error));
  }
}
</script>
</body>
</html>
